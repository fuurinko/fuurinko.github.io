<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于 | Fuurinko</title>
    <meta name="description" content="关于这个重建版本博客的说明。" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header compact">
        <div>
          <p class="site-kicker">About</p>
          <h1>关于这个版本</h1>
        </div>
        <nav class="site-nav">
          <a href="/">首页</a>
          <a href="/posts.html">文章</a>
          <a href="/about.html" aria-current="page">关于</a>
        </nav>
      </header>

      <main class="panel prose-panel">
        <p>
          这是一个为了重新接管 <code>fuurinko.github.io</code>
          而做的最小版本。它不试图复刻旧主题，只先保证：
        </p>
        <ul>
          <li>原 URL 可以重新上线</li>
          <li>文章内容有地方安放</li>
          <li>后续可以渐进式迁移和改版</li>
        </ul>
        <p>如果之后要继续扩展，推荐的方向是：</p>
        <ul>
          <li>批量把现有 Markdown 转成文章页</li>
          <li>补文章列表数据</li>
          <li>补旧链接跳转</li>
          <li>如果需要，再切换到 Astro 或 Hugo</li>
        </ul>
      </main>
    </div>
  </body>
</html>
